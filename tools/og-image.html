<!doctype html>
<!-- 分享預覽圖樣板（assets/og-image.png）。改字後用 Chrome 無頭模式重截：
     "Google Chrome" --headless=new --hide-scrollbars --window-size=1200,630 --virtual-time-budget=4000 --screenshot=assets/og-image.png file://$PWD/tools/og-image.html -->
<html lang="zh-Hant-TW"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{background:#FBFAF8;color:#3A342D;font-family:"Noto Sans TC","PingFang TC",sans-serif;position:relative}
  .wall{position:absolute;left:0;right:0;bottom:0;height:150px;background:#DCDAD5}
  .logo{position:absolute;left:80px;top:64px;height:70px}
  h1{position:absolute;left:80px;top:196px;margin:0;font-size:96px;line-height:1.25;font-weight:700;letter-spacing:.01em}
  h1 span{color:#A94632}
  .plate{position:absolute;left:80px;right:80px;bottom:40px;height:70px;background:#F6F5F2;display:flex;align-items:center;gap:28px;padding:0 32px}
  .plate svg{width:40px;height:40px;fill:none;stroke:#3A342D;stroke-width:3;stroke-linecap:square}
  .plate p{margin:0;font-size:26px;font-weight:700}
  .plate .en{margin-left:auto;font-size:17px;font-weight:400;letter-spacing:.12em;text-transform:uppercase;color:#6F6558}
</style></head><body>
<img class="logo" src="../assets/suxi-horizontal-bi.svg" alt="">
<h1>進現場，<br>把問題做完<span>。</span></h1>
<div class="wall"></div>
<div class="plate">
  <svg viewBox="0 0 44 44"><path d="M5 22H38M24 8L38 22L24 36"/></svg>
  <p>把 AI 接進正在跑的舊系統</p>
  <p class="en">SUXI AI · On the factory floor</p>
</div>
</body></html>
